[package]
name = "agenticon"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
authors = ["CryptoPatrick <cryptopatrick@gmail.com>"]

###############################################################################
description = "agenticon is a library built around custom generation of identicon images for AI agents."
documentation = "https://docs.rs/agenticon"
homepage = "https://github.com/cryptopatrick/agenticon"
repository = "https://github.com/cryptopatrick/agenticon"
readme = "README.md"
keywords = ["identicon", "avatar", "agent", "generative", "sound"]
license = "AGPL-3.0-only"
categories = ["graphics", "multimedia::audio", "cryptography::cryptocurrencies"]
exclude = ["NOTES.md", "TODO.md", ".github/"]
autotests = false

###############################################################################
[lib]
name = "agenticon"
path = "src/lib.rs"

[[test]]
name = "tests"
path = "tests/test.rs"

###############################################################################
[dependencies]
sha2 = "0.10"
tiny-skia = "0.11"

[[test]]
name = "golden"
path = "tests/golden.rs"

###############################################################################
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
